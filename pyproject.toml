[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fsae-susp"
version = "0.1.0"
description = "FSAE double-wishbone suspension tools: VSusp-compatible front view, pivot optimiser and 3D check"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5", "pyyaml>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
fsae-susp = "fsaesusp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
